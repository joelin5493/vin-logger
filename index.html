<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>PSA 隱藏功能管理</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        h2 { margin-top: 30px; }
        table { width: 100%; background: white; border-collapse: collapse; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; vertical-align: middle; }
        th { background: #343a40; color: white; }
        .status-success { color: #28a745; font-weight: bold; }
        .status-fail { color: #dc3545; font-weight: bold; }
        .code-normal { color: #6c757d; font-size: 0.9em; }
        .code-error { background: #dc3545; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-family: monospace; }

        .panel {
            background: white; padding: 15px 20px; margin-bottom: 20px;
            border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .row-flex { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #28a745; }
        input:checked + .slider:before { transform: translateX(22px); }
        /* killed（整片停用）用紅色，語意跟其他開關相反：checked = 危險/停用中 */
        .slider.danger { background-color: #6c757d; }
        input:checked + .slider.danger { background-color: #dc3545; }

        input[type="email"], input[type="password"], input[type="text"] {
            padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
        }
        button {
            padding: 8px 16px; border: none; border-radius: 4px; background: #343a40; color: white;
            cursor: pointer; font-size: 14px;
        }
        button:hover { background: #495057; }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        #loginError { color: #dc3545; margin-top: 8px; font-size: 13px; }
        .board-name { font-weight: bold; font-family: monospace; }
        .killed-badge { color: #dc3545; font-weight: bold; margin-left: 6px; }
    </style>
</head>
<body>

    <!-- 登入畫面 -->
    <div id="loginView" class="panel" style="max-width: 360px; margin: 60px auto;">
        <h2 style="margin-top:0">🔒 管理員登入</h2>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
            <input id="loginPassword" type="password" placeholder="密碼" autocomplete="current-password">
            <button id="loginBtn">登入</button>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- 主控台 -->
    <div id="mainView" style="display:none">
        <div class="row-flex" style="justify-content: space-between;">
            <h2 style="margin:0">🛠️ PSA 隱藏功能管理</h2>
            <div>
                <span id="whoami" style="margin-right:12px; color:#666; font-size:13px;"></span>
                <button id="logoutBtn">登出</button>
            </div>
        </div>

        <h2>板子權限</h2>
        <div class="panel row-flex">
            <input id="newBoardName" type="text" placeholder="新增板子名稱，例：PSA-CAN-BRIDGE-A1B2" style="flex:1; min-width:220px;">
            <button id="addBoardBtn">新增板子</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>板子</th>
                    <th>整片停用</th>
                    <th>手動讀寫</th>
                    <th>怠速啟停－開</th>
                    <th>彎道輔助－開</th>
                    <th>半自動停車－開<br><span style="font-weight:normal;font-size:11px;color:#aaa;">(功能未實作)</span></th>
                    <th>顯示 Log<br><span style="font-weight:normal;font-size:11px;color:#aaa;">關＝改用彈窗通知</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="boardsBody">
                <tr><td colspan="8" style="text-align:center;color:#999;">載入中…</td></tr>
            </tbody>
        </table>

        <div class="row-flex" style="justify-content: space-between; margin-top: 20px;">
            <h2 style="margin:0">執行紀錄</h2>
            <button id="exportCsvBtn">⬇️ 匯出 CSV</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>時間</th>
                    <th>板子</th>
                    <th>車身碼 (VIN)</th>
                    <th>功能</th>
                    <th>結果</th>
                    <th>狀態碼</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="logTableBody"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getDatabase, ref, onValue, set, remove,
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkGSJH-Xu_jcxzDU6GhZSUoi02q4wnlSc",
            databaseURL: "https://vin-logger-default-rtdb.asia-southeast1.firebasedatabase.app/",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const loginView = document.getElementById('loginView');
        const mainView = document.getElementById('mainView');
        const loginError = document.getElementById('loginError');
        const whoami = document.getElementById('whoami');

        let stopBoards = null;
        let stopLogs = null;

        // ==========================================
        // 登入 / 登出
        // ==========================================
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value.trim();
            const pw = document.getElementById('loginPassword').value;
            loginError.innerText = '';
            signInWithEmailAndPassword(auth, email, pw).catch((err) => {
                loginError.innerText = '登入失敗：' + err.message;
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // ==========================================
        // 閒置 30 分鐘自動登出：任何滑鼠/鍵盤/觸控/捲動操作都會重新計時，
        // 真的放著不管超過 30 分鐘才會登出，不是登入後準時 30 分鐘就踢人。
        // ==========================================
        const IDLE_TIMEOUT_MS = 30 * 60 * 1000;
        const IDLE_EVENTS = ['click', 'mousemove', 'keydown', 'touchstart', 'scroll'];
        let idleTimer = null;

        function resetIdleTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                signOut(auth);
                alert('閒置超過 30 分鐘，已自動登出。');
            }, IDLE_TIMEOUT_MS);
        }

        function startIdleWatch() {
            resetIdleTimer();
            IDLE_EVENTS.forEach((evt) => document.addEventListener(evt, resetIdleTimer));
        }

        function stopIdleWatch() {
            if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
            IDLE_EVENTS.forEach((evt) => document.removeEventListener(evt, resetIdleTimer));
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginView.style.display = 'none';
                mainView.style.display = 'block';
                whoami.innerText = user.email || '';
                startListening();
                startIdleWatch();
            } else {
                loginView.style.display = 'block';
                mainView.style.display = 'none';
                if (stopBoards) { stopBoards(); stopBoards = null; }
                if (stopLogs) { stopLogs(); stopLogs = null; }
                stopIdleWatch();
            }
        });

        function startListening() {
            stopBoards = onValue(ref(db, 'boards'), (snapshot) => {
                renderBoards(snapshot.val() || {});
            });
            stopLogs = onValue(ref(db, 'Function_Logs'), (snapshot) => {
                renderLogs(snapshot.val() || {});
            });
        }

        // ==========================================
        // 板子權限表格
        // ==========================================
        function switchHtml(path, checked, danger) {
            return `<label class="switch">
                <input type="checkbox" data-path="${path}" ${checked ? 'checked' : ''}>
                <span class="slider${danger ? ' danger' : ''}"></span>
            </label>`;
        }

        function renderBoards(data) {
            const body = document.getElementById('boardsBody');
            const names = Object.keys(data).sort();

            if (names.length === 0) {
                body.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;">還沒有登記任何板子</td></tr>';
                return;
            }

            body.innerHTML = names.map((name) => {
                const b = data[name] || {};
                const feats = b.features || {};
                const killed = !!b.killed;
                // 欄位不存在（舊資料，還沒手動設定過）當作 true（顯示 log），跟 App 端邏輯一致，
                // 避免既有板子的行為被悄悄改變成彈窗模式。
                const showLog = b.showLog === undefined ? true : !!b.showLog;
                return `<tr>
                    <td><span class="board-name">${name}</span>${killed ? '<span class="killed-badge">🛑 已停用</span>' : ''}</td>
                    <td>${switchHtml(`boards/${name}/killed`, killed, true)}</td>
                    <td>${switchHtml(`boards/${name}/manualReadWrite`, !!b.manualReadWrite)}</td>
                    <td>${switchHtml(`boards/${name}/features/startStop`, !!feats.startStop)}</td>
                    <td>${switchHtml(`boards/${name}/features/corneringLight`, !!feats.corneringLight)}</td>
                    <td>${switchHtml(`boards/${name}/features/semiAutoPark`, !!feats.semiAutoPark)}</td>
                    <td>${switchHtml(`boards/${name}/showLog`, showLog)}</td>
                    <td><button class="danger" data-del-board="${name}">刪除板子</button></td>
                </tr>`;
            }).join('');

            body.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
                cb.addEventListener('change', (e) => {
                    const path = e.target.dataset.path;
                    const val = e.target.checked;
                    e.target.disabled = true;
                    set(ref(db, path), val)
                        .catch((err) => {
                            alert('更新失敗：' + err.message);
                            e.target.checked = !val;
                        })
                        .finally(() => { e.target.disabled = false; });
                });
            });

            body.querySelectorAll('button[data-del-board]').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    const name = e.target.dataset.delBoard;
                    if (!confirm(`確定要刪除板子「${name}」嗎？\n\n刪除後這片板子會回到「未登記」狀態，連線後所有功能會自動全部停用，直到你重新新增它為止。此動作不會影響它過去的執行紀錄。`)) return;
                    e.target.disabled = true;
                    remove(ref(db, `boards/${name}`)).catch((err) => {
                        alert('刪除失敗：' + err.message);
                        e.target.disabled = false;
                    });
                });
            });
        }

        document.getElementById('addBoardBtn').addEventListener('click', () => {
            const input = document.getElementById('newBoardName');
            const name = input.value.trim();
            if (!name) return;
            set(ref(db, `boards/${name}`), {
                killed: false,
                manualReadWrite: false,
                features: { startStop: false, corneringLight: false, semiAutoPark: false },
                showLog: true,
            }).then(() => { input.value = ''; })
              .catch((err) => alert('新增失敗：' + err.message));
        });

        // ==========================================
        // 執行紀錄
        // ==========================================
        // 保留一份帶 key 的原始資料，刪除／匯出 CSV 都要用到。
        let currentLogs = []; // [{ key, ...record }]，新到舊排序（跟畫面顯示順序一致）

        function escHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        function renderLogs(data) {
            currentLogs = Object.entries(data)
                .map(([key, record]) => ({ key, ...record }))
                .reverse(); // 新到舊

            const tableBody = document.getElementById('logTableBody');
            tableBody.innerHTML = '';

            currentLogs.forEach((record) => {
                const isSuccess = (record.status === "成功" || record.status_code === 1 || record.status_code === 6);
                const statusClass = isSuccess ? "status-success" : "status-fail";
                const statusLabel = isSuccess ? "✅ 成功" : "❌ 失敗";

                const codeVal = record.status_code !== undefined ? record.status_code : "N/A";
                const codeHtml = isSuccess
                    ? `<span class="code-normal">${codeVal}</span>`
                    : `<span class="code-error" title="發生錯誤，代碼：${codeVal}">${codeVal}</span>`;

                const row = `<tr>
                    <td>${escHtml(record.timestamp)}</td>
                    <td class="board-name">${escHtml(record.board ?? '(舊紀錄，無板子資訊)')}</td>
                    <td><strong>${escHtml(record.vin)}</strong></td>
                    <td>${escHtml(record.function_name)}</td>
                    <td class="${statusClass}">${statusLabel}</td>
                    <td>${codeHtml}</td>
                    <td><button class="danger" data-del-key="${record.key}">刪除</button></td>
                </tr>`;
                tableBody.innerHTML += row;
            });

            tableBody.querySelectorAll('button[data-del-key]').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    const key = e.target.dataset.delKey;
                    if (!confirm('確定要刪除這筆紀錄嗎？此動作無法復原。')) return;
                    e.target.disabled = true;
                    remove(ref(db, `Function_Logs/${key}`)).catch((err) => {
                        alert('刪除失敗：' + err.message);
                        e.target.disabled = false;
                    });
                    // 成功的話 onValue 監聽會自動收到更新、重繪整張表，不用自己動 DOM
                });
            });
        }

        // ==========================================
        // 匯出 CSV（含 UTF-8 BOM，避免 Excel 用 ANSI/Big5 打開變亂碼）
        // ==========================================
        function csvField(v) {
            const s = String(v ?? '');
            // 只要含逗號、換行、雙引號，就整段用雙引號包起來，裡面的雙引號變兩個雙引號跳脫
            if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
            return s;
        }

        document.getElementById('exportCsvBtn').addEventListener('click', () => {
            const header = ['時間', '板子', '車身碼(VIN)', '功能', '結果', '狀態碼'];
            const lines = [header.map(csvField).join(',')];

            // CSV 照時間舊到新排（跟畫面新到舊相反，符合一般試算表由上往下遞增的閱讀習慣）
            [...currentLogs].reverse().forEach((r) => {
                const isSuccess = (r.status === "成功" || r.status_code === 1 || r.status_code === 6);
                lines.push([
                    r.timestamp ?? '',
                    r.board ?? '',
                    r.vin ?? '',
                    r.function_name ?? '',
                    isSuccess ? '成功' : '失敗',
                    r.status_code ?? '',
                ].map(csvField).join(','));
            });

            // 關鍵：開頭加 UTF-8 BOM (﻿)。沒有這個，Windows 版 Excel 會用系統
            // 預設的 ANSI/Big5 開啟 CSV，中文全部變亂碼；加了 BOM，Excel 會正確認出 UTF-8。
            const csvContent = '﻿' + lines.join('\r\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
            a.href = url;
            a.download = `Function_Logs_${stamp}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
